<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Epstein Clicker</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; color:#fff; font-family: Arial, sans-serif; height:100vh; overflow:hidden; }
        /* Загрузочный экран */
        #loading {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:#0a0a0a; display:flex; flex-direction:column;
            align-items:center; justify-content:center; z-index:999;
        }
        #loading h1 { font-size:2rem; color:#fc0; text-shadow:0 0 25px #fc0; margin-bottom:20px; }
        .loader {
            width:50px; height:50px; border:4px solid #333;
            border-top:4px solid #fc0; border-radius:50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to{ transform:rotate(360deg); } }
        /* Основной интерфейс */
        #app { display:none; flex-direction:column; align-items:center; padding:20px; height:100vh; }
        #balance { font-size:2.2rem; font-weight:bold; margin:15px 0 5px; text-shadow:0 0 12px #fc0; }
        .circle {
            width:170px; height:170px; border-radius:50%;
            background:url('https://upload.wikimedia.org/wikipedia/commons/7/7d/Jeffrey_Epstein%2C_27_%28cropped%29.jpg') center/cover;
            border:4px solid #fc0; box-shadow:0 0 30px #fc0; cursor:pointer;
            transition: transform 0.1s; -webkit-tap-highlight-color:transparent;
        }
        .circle:active { transform:scale(0.9); }
        .menu { display:flex; gap:8px; margin:18px 0; }
        .btn { background:#222; color:#fff; padding:8px 16px; border-radius:20px; border:none; font-size:0.9rem; cursor:pointer; }
        .btn.active { background:#fc0; color:#000; font-weight:bold; }
        .section { display:none; width:100%; max-width:380px; }
        .section.active { display:block; }
        /* shop */
        .shop-item { background:#1a1a1a; padding:12px; margin:8px 0; border-radius:10px; display:flex; justify-content:space-between; align-items:center; }
        .buy-btn { background:#fc0; color:#000; border:none; padding:6px 16px; border-radius:10px; font-weight:bold; cursor:pointer; }
        /* top */
        .top-list { list-style:none; padding:0; }
        .top-list li { background:#1a1a1a; padding:10px; margin:5px 0; border-radius:8px; display:flex; justify-content:space-between; }
        /* daily */
        #dailyBtn { width:100%; margin-bottom:10px; padding:12px; background:#fc0; color:#000; font-weight:bold; border:none; border-radius:10px; font-size:1rem; cursor:pointer; }
    </style>
</head>
<body>

<!-- Загрузочный экран -->
<div id="loading">
    <h1>🏝️ Остров Эпштейна</h1>
    <div class="loader"></div>
</div>

<!-- Основная игра -->
<div id="app">
    <div id="balance">0 Epstein Coins</div>
    <div class="circle" id="clicker"></div>

    <div class="menu">
        <button class="btn active" data-tab="clicker-tab">Кликер</button>
        <button class="btn" data-tab="shop-tab">Магазин</button>
        <button class="btn" data-tab="top-tab">Топ</button>
    </div>

    <div id="clicker-tab" class="section active"></div>

    <div id="shop-tab" class="section">
        <button id="dailyBtn">🎁 Ежедневный бонус</button>
        <div class="shop-item">
            <span>x2 клики (30с) — 100 монет</span>
            <button class="buy-btn" data-cost="100" data-boost="x2">Купить</button>
        </div>
        <div class="shop-item">
            <span>+5 к клику (60с) — 200 монет</span>
            <button class="buy-btn" data-cost="200" data-boost="add5">Купить</button>
        </div>
    </div>

    <div id="top-tab" class="section">
        <h3>🏆 Топ игроков</h3>
        <ul class="top-list" id="topList"></ul>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    const user_id = tg?.initDataUnsafe?.user?.id || 0;
    let balance = 0;
    let multiplier = 1;
    let boostEnd = 0;
    let boostTimer = null;

    const API = '/api';
    const balanceEl = document.getElementById('balance');
    const clicker = document.getElementById('clicker');
    const tabs = document.querySelectorAll('.menu .btn');
    const sections = document.querySelectorAll('.section');
    const topList = document.getElementById('topList');
    const dailyBtn = document.getElementById('dailyBtn');
    const loading = document.getElementById('loading');
    const app = document.getElementById('app');

    // Загрузочный экран
    window.addEventListener('load', () => {
        setTimeout(() => {
            loading.style.display = 'none';
            app.style.display = 'flex';
            loadData();
        }, 2000);
    });

    // Табы
    tabs.forEach(b => b.addEventListener('click', () => {
        tabs.forEach(tb => tb.classList.remove('active'));
        b.classList.add('active');
        sections.forEach(sec => sec.classList.remove('active'));
        document.getElementById(b.dataset.tab).classList.add('active');
        if(b.dataset.tab === 'top-tab') loadTop();
    }));

    // Загрузка баланса
    async function loadData() {
        if(!user_id) return;
        const res = await fetch(`${API}/balance?user_id=${user_id}`);
        const data = await res.json();
        balance = data.balance;
        updateUI();
    }

    function updateUI() {
        balanceEl.textContent = balance + ' Epstein Coins';
    }

    // Кликер
    let clickBuffer = 0;
    clicker.addEventListener('click', () => {
        let add = 1;
        if(multiplier === 'x2') add = 2;
        else if(multiplier === 'add5') add = 5;
        balance += add;
        clickBuffer += add;
        updateUI();
    });

    // Автосохранение кликов
    setInterval(async () => {
        if(clickBuffer > 0 && user_id) {
            await fetch(`${API}/click`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ user_id, count: clickBuffer })
            });
            clickBuffer = 0;
        }
    }, 5000);

    // Магазин
    document.querySelectorAll('.buy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const cost = parseInt(btn.dataset.cost);
            const boost = btn.dataset.boost;
            const res = await fetch(`${API}/buy_booster`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ user_id, cost })
            });
            const data = await res.json();
            if(data.success) {
                balance = data.balance;
                updateUI();
                // Применяем бустер
                if(boost === 'x2') {
                    multiplier = 'x2';
                    if(boostTimer) clearTimeout(boostTimer);
                    boostTimer = setTimeout(() => { multiplier = 1; alert('Бустер x2 закончился'); }, 30000);
                } else if(boost === 'add5') {
                    multiplier = 'add5';
                    if(boostTimer) clearTimeout(boostTimer);
                    boostTimer = setTimeout(() => { multiplier = 1; alert('Бустер +5 закончился'); }, 60000);
                }
            } else {
                alert(data.message);
            }
        });
    });

    // Ежедневный бонус
    dailyBtn.addEventListener('click', async () => {
        const res = await fetch(`${API}/daily`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ user_id })
        });
        const data = await res.json();
        if(data.success) {
            balance = data.balance;
            updateUI();
            alert(`Забрал +${data.bonus} монет!`);
        } else {
            alert(data.message);
        }
    });

    // Топ
    async function loadTop() {
        const res = await fetch(`${API}/top`);
        const top = await res.json();
        topList.innerHTML = top.map((item, i) =>
            `<li><span>#${i+1} ${item.username}</span><span>${item.balance}</span></li>`
        ).join('');
    }
</script>
</body>
</html>
